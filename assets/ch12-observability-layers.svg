<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" font-family="Segoe UI, Arial, sans-serif" role="img">
  <title>Camadas de Observabilidade para AI</title>
  <desc>O que o arquiteto precisa observar além da infraestrutura tradicional.</desc>

  <text x="340" y="35" text-anchor="middle" font-weight="bold" font-size="18" fill="#1a3a5c">Observabilidade para AI</text>

  <rect x="40" y="70" width="180" height="160" rx="8" fill="#dae8fc" stroke="#6c8ebf" stroke-width="2"/>
  <text x="130" y="105" text-anchor="middle" font-weight="bold" font-size="13" fill="#1a3a5c">Infra</text>
  <text x="130" y="135" text-anchor="middle" font-size="11" fill="#333">GPU utilization</text>
  <text x="130" y="155" text-anchor="middle" font-size="11" fill="#333">Latência</text>
  <text x="130" y="175" text-anchor="middle" font-size="11" fill="#333">Erros</text>

  <rect x="250" y="70" width="180" height="160" rx="8" fill="#d5e8d4" stroke="#82b366" stroke-width="2"/>
  <text x="340" y="105" text-anchor="middle" font-weight="bold" font-size="13" fill="#2d5a1b">Modelo</text>
  <text x="340" y="135" text-anchor="middle" font-size="11" fill="#333">Tokens / request</text>
  <text x="340" y="155" text-anchor="middle" font-size="11" fill="#333">TTFT</text>
  <text x="340" y="175" text-anchor="middle" font-size="11" fill="#333">Qualidade</text>

  <rect x="460" y="70" width="180" height="160" rx="8" fill="#e1d5e7" stroke="#9673a6" stroke-width="2"/>
  <text x="550" y="105" text-anchor="middle" font-weight="bold" font-size="13" fill="#5a3d6a">Agent</text>
  <text x="550" y="135" text-anchor="middle" font-size="11" fill="#333">Steps</text>
  <text x="550" y="155" text-anchor="middle" font-size="11" fill="#333">Tool calls</text>
  <text x="550" y="175" text-anchor="middle" font-size="11" fill="#333">Custo por execução</text>
</svg>