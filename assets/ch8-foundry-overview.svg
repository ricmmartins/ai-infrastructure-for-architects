<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" font-family="Segoe UI, Arial, sans-serif" role="img">
  <title>Visão geral do Microsoft Foundry para Arquitetos</title>
  <desc>Camadas principais do Microsoft Foundry do ponto de vista de system design.</desc>

  <text x="360" y="35" text-anchor="middle" font-weight="bold" font-size="18" fill="#1a3a5c">Microsoft Foundry — Visão do Arquiteto</text>

  <!-- Models -->
  <rect x="40" y="70" width="200" height="70" rx="8" fill="#dae8fc" stroke="#6c8ebf" stroke-width="2"/>
  <text x="140" y="100" text-anchor="middle" font-weight="bold" font-size="13" fill="#1a3a5c">Model Catalog</text>
  <text x="140" y="120" text-anchor="middle" font-size="11" fill="#555">Closed + Open Weights</text>

  <!-- Agents -->
  <rect x="260" y="70" width="200" height="70" rx="8" fill="#d5e8d4" stroke="#82b366" stroke-width="2"/>
  <text x="360" y="100" text-anchor="middle" font-weight="bold" font-size="13" fill="#2d5a1b">Agent Service</text>
  <text x="360" y="120" text-anchor="middle" font-size="11" fill="#555">Orquestração + Tools</text>

  <!-- Evaluation -->
  <rect x="480" y="70" width="200" height="70" rx="8" fill="#e1d5e7" stroke="#9673a6" stroke-width="2"/>
  <text x="580" y="100" text-anchor="middle" font-weight="bold" font-size="13" fill="#5a3d6a">Evaluation</text>
  <text x="580" y="120" text-anchor="middle" font-size="11" fill="#555">Qualidade e segurança</text>

  <!-- Bottom layer -->
  <rect x="80" y="180" width="560" height="100" rx="10" fill="#fff2cc" stroke="#d6b656" stroke-width="2"/>
  <text x="360" y="215" text-anchor="middle" font-weight="bold" font-size="14" fill="#7a5900">Infraestrutura Gerenciada</text>
  <text x="360" y="240" text-anchor="middle" font-size="12" fill="#333">Compute, rede, identidade, observabilidade e governança</text>
  <text x="360" y="260" text-anchor="middle" font-size="12" fill="#333">O arquiteto decide o quanto quer gerenciar vs consumir</text>
</svg>