<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" font-family="Segoe UI, Arial, sans-serif" role="img">
  <title>Mental Model: Traditional Application vs AI Workload</title>
  <desc>Side-by-side comparison of a traditional request-response application and an AI system with training, inference, and agent modes.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#666"/>
    </marker>
  </defs>

  <!-- Traditional App -->
  <rect x="20" y="20" width="320" height="380" rx="12" fill="#f5f5f5" stroke="#666" stroke-width="2"/>
  <text x="180" y="50" text-anchor="middle" font-weight="bold" font-size="16" fill="#333">Aplicação Tradicional</text>
  
  <rect x="50" y="80" width="260" height="70" rx="8" fill="#dae8fc" stroke="#6c8ebf" stroke-width="2"/>
  <text x="180" y="110" text-anchor="middle" font-weight="bold" font-size="13" fill="#1a3a5c">Request / Response</text>
  <text x="180" y="130" text-anchor="middle" font-size="11" fill="#555">Determinístico, stateless</text>

  <line x1="180" y1="150" x2="180" y2="180" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="50" y="190" width="260" height="70" rx="8" fill="#d5e8d4" stroke="#82b366" stroke-width="2"/>
  <text x="180" y="220" text-anchor="middle" font-weight="bold" font-size="13" fill="#2d5a1b">Lógica de Negócio</text>
  <text x="180" y="240" text-anchor="middle" font-size="11" fill="#555">Código fixo + banco de dados</text>

  <line x1="180" y1="260" x2="180" y2="290" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="50" y="300" width="260" height="70" rx="8" fill="#fff2cc" stroke="#d6b656" stroke-width="2"/>
  <text x="180" y="330" text-anchor="middle" font-weight="bold" font-size="13" fill="#7a5900">Infraestrutura Clássica</text>
  <text x="180" y="350" text-anchor="middle" font-size="11" fill="#555">CPU, rede, storage padrão</text>

  <!-- AI Workload -->
  <rect x="380" y="20" width="320" height="380" rx="12" fill="#f5f5f5" stroke="#666" stroke-width="2"/>
  <text x="540" y="50" text-anchor="middle" font-weight="bold" font-size="16" fill="#333">Workload de AI</text>

  <rect x="410" y="80" width="260" height="55" rx="8" fill="#dae8fc" stroke="#6c8ebf" stroke-width="2"/>
  <text x="540" y="105" text-anchor="middle" font-weight="bold" font-size="12" fill="#1a3a5c">Training</text>
  <text x="540" y="122" text-anchor="middle" font-size="10" fill="#555">Batch, multi-GPU, dias/semanas</text>

  <rect x="410" y="150" width="260" height="55" rx="8" fill="#d5e8d4" stroke="#82b366" stroke-width="2"/>
  <text x="540" y="175" text-anchor="middle" font-weight="bold" font-size="12" fill="#2d5a1b">Inference</text>
  <text x="540" y="192" text-anchor="middle" font-size="10" fill="#555">Online, latência, throughput</text>

  <rect x="410" y="220" width="260" height="55" rx="8" fill="#e1d5e7" stroke="#9673a6" stroke-width="2"/>
  <text x="540" y="245" text-anchor="middle" font-weight="bold" font-size="12" fill="#5a3d6a">Agents</text>
  <text x="540" y="262" text-anchor="middle" font-size="10" fill="#555">Loops, tools, memória, estado</text>

  <line x1="540" y1="275" x2="540" y2="305" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="410" y="310" width="260" height="70" rx="8" fill="#fff2cc" stroke="#d6b656" stroke-width="2"/>
  <text x="540" y="340" text-anchor="middle" font-weight="bold" font-size="12" fill="#7a5900">Infraestrutura Especializada</text>
  <text x="540" y="358" text-anchor="middle" font-size="10" fill="#555">GPU, HBM, NVLink, InfiniBand</text>
</svg>