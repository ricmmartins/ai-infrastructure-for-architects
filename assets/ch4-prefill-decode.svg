<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" font-family="Segoe UI, Arial, sans-serif" role="img">
  <title>Prefill vs Decode</title>
  <desc>Diferença entre a fase de Prefill (compute-bound) e Decode (memory-bound) na inference de LLMs.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#666"/>
    </marker>
  </defs>

  <text x="360" y="35" text-anchor="middle" font-weight="bold" font-size="18" fill="#1a3a5c">Prefill vs Decode</text>

  <!-- Prefill -->
  <rect x="40" y="60" width="300" height="220" rx="12" fill="#dae8fc" stroke="#6c8ebf" stroke-width="2"/>
  <text x="190" y="95" text-anchor="middle" font-weight="bold" font-size="16" fill="#1a3a5c">Prefill</text>
  <text x="190" y="125" text-anchor="middle" font-size="12" fill="#333">Processa o prompt inteiro</text>
  <text x="190" y="150" text-anchor="middle" font-size="12" fill="#333">Compute-bound</text>
  <text x="190" y="175" text-anchor="middle" font-size="12" fill="#333">Gera o KV cache</text>
  <text x="190" y="200" text-anchor="middle" font-size="12" fill="#333">Define o TTFT</text>
  <text x="190" y="240" text-anchor="middle" font-size="11" fill="#555" font-style="italic">Quanto maior o prompt, mais pesado</text>

  <!-- Decode -->
  <rect x="380" y="60" width="300" height="220" rx="12" fill="#d5e8d4" stroke="#82b366" stroke-width="2"/>
  <text x="530" y="95" text-anchor="middle" font-weight="bold" font-size="16" fill="#2d5a1b">Decode</text>
  <text x="530" y="125" text-anchor="middle" font-size="12" fill="#333">Gera um token por vez</text>
  <text x="530" y="150" text-anchor="middle" font-size="12" fill="#333">Memory-bound (KV cache)</text>
  <text x="530" y="175" text-anchor="middle" font-size="12" fill="#333">Define o throughput</text>
  <text x="530" y="200" text-anchor="middle" font-size="12" fill="#333">Sensivel a batch size</text>
  <text x="530" y="240" text-anchor="middle" font-size="11" fill="#555" font-style="italic">Quanto mais tokens gerados, mais lento</text>
</svg>