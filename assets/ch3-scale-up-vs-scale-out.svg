<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" font-family="Segoe UI, Arial, sans-serif" role="img">
  <title>Scale-up vs Scale-out em AI</title>
  <desc>Comparação visual entre scale-up (dentro do nó com NVLink) e scale-out (entre nós com InfiniBand) para workloads de AI.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#666"/>
    </marker>
  </defs>

  <text x="360" y="35" text-anchor="middle" font-weight="bold" font-size="18" fill="#1a3a5c">Scale-up vs Scale-out</text>

  <!-- Scale-up -->
  <rect x="30" y="60" width="320" height="300" rx="12" fill="#dae8fc" stroke="#6c8ebf" stroke-width="2"/>
  <text x="190" y="90" text-anchor="middle" font-weight="bold" font-size="15" fill="#1a3a5c">Scale-up (dentro do nó)</text>

  <rect x="70" y="120" width="80" height="50" rx="6" fill="#fff2cc" stroke="#d6b656"/>
  <text x="110" y="150" text-anchor="middle" font-size="11" fill="#333">GPU 0</text>

  <rect x="170" y="120" width="80" height="50" rx="6" fill="#fff2cc" stroke="#d6b656"/>
  <text x="210" y="150" text-anchor="middle" font-size="11" fill="#333">GPU 1</text>

  <rect x="70" y="200" width="80" height="50" rx="6" fill="#fff2cc" stroke="#d6b656"/>
  <text x="110" y="230" text-anchor="middle" font-size="11" fill="#333">GPU 2</text>

  <rect x="170" y="200" width="80" height="50" rx="6" fill="#fff2cc" stroke="#d6b656"/>
  <text x="210" y="230" text-anchor="middle" font-size="11" fill="#333">GPU 3</text>

  <text x="190" y="280" text-anchor="middle" font-size="12" fill="#1a3a5c" font-weight="bold">NVLink</text>
  <text x="190" y="300" text-anchor="middle" font-size="11" fill="#555">Alta banda, baixa latência</text>
  <text x="190" y="320" text-anchor="middle" font-size="11" fill="#555">Ideal para tensor parallel</text>

  <!-- Scale-out -->
  <rect x="370" y="60" width="320" height="300" rx="12" fill="#d5e8d4" stroke="#82b366" stroke-width="2"/>
  <text x="530" y="90" text-anchor="middle" font-weight="bold" font-size="15" fill="#2d5a1b">Scale-out (entre nós)</text>

  <rect x="410" y="130" width="100" height="60" rx="6" fill="#fff2cc" stroke="#d6b656"/>
  <text x="460" y="165" text-anchor="middle" font-size="11" fill="#333">Nó 1</text>

  <rect x="550" y="130" width="100" height="60" rx="6" fill="#fff2cc" stroke="#d6b656"/>
  <text x="600" y="165" text-anchor="middle" font-size="11" fill="#333">Nó 2</text>

  <rect x="410" y="220" width="100" height="60" rx="6" fill="#fff2cc" stroke="#d6b656"/>
  <text x="460" y="255" text-anchor="middle" font-size="11" fill="#333">Nó 3</text>

  <rect x="550" y="220" width="100" height="60" rx="6" fill="#fff2cc" stroke="#d6b656"/>
  <text x="600" y="255" text-anchor="middle" font-size="11" fill="#333">Nó 4</text>

  <text x="530" y="300" text-anchor="middle" font-size="12" fill="#2d5a1b" font-weight="bold">InfiniBand</text>
  <text x="530" y="320" text-anchor="middle" font-size="11" fill="#555">All-reduce, data parallel</text>
  <text x="530" y="340" text-anchor="middle" font-size="11" fill="#555">Escala para milhares de GPUs</text>
</svg>