<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" font-family="Segoe UI, Arial, sans-serif" role="img">
  <title>Composição de Padrões</title>
  <desc>Como diferentes padrões se combinam em uma arquitetura real.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#666"/>
    </marker>
  </defs>

  <text x="360" y="35" text-anchor="middle" font-weight="bold" font-size="18" fill="#1a3a5c">Composição Típica</text>

  <rect x="40" y="80" width="140" height="50" rx="6" fill="#fff2cc" stroke="#d6b656"/>
  <text x="110" y="110" text-anchor="middle" font-size="12" fill="#7a5900">Request</text>

  <line x1="180" y1="105" x2="220" y2="105" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="230" y="70" width="160" height="70" rx="6" fill="#dae8fc" stroke="#6c8ebf"/>
  <text x="310" y="100" text-anchor="middle" font-size="12" fill="#1a3a5c">Router</text>
  <text x="310" y="120" text-anchor="middle" font-size="10" fill="#555">Decisão de padrão</text>

  <line x1="390" y1="90" x2="430" y2="70" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="390" y1="120" x2="430" y2="140" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="440" y="50" width="140" height="50" rx="6" fill="#d5e8d4" stroke="#82b366"/>
  <text x="510" y="80" text-anchor="middle" font-size="11" fill="#2d5a1b">Closed Model</text>

  <rect x="440" y="130" width="140" height="50" rx="6" fill="#e1d5e7" stroke="#9673a6"/>
  <text x="510" y="160" text-anchor="middle" font-size="11" fill="#5a3d6a">Open + RAG</text>

  <text x="360" y="230" text-anchor="middle" font-size="12" fill="#333">O router permite combinar padrões sem acoplar tudo.</text>
  <text x="360" y="255" text-anchor="middle" font-size="12" fill="#333">A complexidade fica concentrada em um ponto controlado.</text>
</svg>