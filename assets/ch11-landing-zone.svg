<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" font-family="Segoe UI, Arial, sans-serif" role="img">
  <title>Landing Zone para AI</title>
  <desc>Estrutura conceitual de uma Landing Zone orientada a workloads de AI.</desc>

  <text x="360" y="35" text-anchor="middle" font-weight="bold" font-size="18" fill="#1a3a5c">Landing Zone para AI</text>

  <!-- Management -->
  <rect x="40" y="60" width="640" height="50" rx="8" fill="#dae8fc" stroke="#6c8ebf" stroke-width="2"/>
  <text x="360" y="90" text-anchor="middle" font-weight="bold" font-size="14" fill="#1a3a5c">Management Group / Políticas</text>

  <!-- Platform -->
  <rect x="60" y="130" width="280" height="80" rx="8" fill="#d5e8d4" stroke="#82b366" stroke-width="2"/>
  <text x="200" y="165" text-anchor="middle" font-weight="bold" font-size="13" fill="#2d5a1b">Platform</text>
  <text x="200" y="185" text-anchor="middle" font-size="11" fill="#555">Identidade, Rede, Monitoramento</text>

  <rect x="380" y="130" width="280" height="80" rx="8" fill="#fff2cc" stroke="#d6b656" stroke-width="2"/>
  <text x="520" y="165" text-anchor="middle" font-weight="bold" font-size="13" fill="#7a5900">Shared Services</text>
  <text x="520" y="185" text-anchor="middle" font-size="11" fill="#555">AI Search, Storage, Key Vault</text>

  <!-- Workloads -->
  <rect x="80" y="240" width="160" height="90" rx="8" fill="#e1d5e7" stroke="#9673a6" stroke-width="1.5"/>
  <text x="160" y="280" text-anchor="middle" font-size="12" fill="#5a3d6a">Inference</text>
  <text x="160" y="300" text-anchor="middle" font-size="11" fill="#555">AKS / Foundry</text>

  <rect x="280" y="240" width="160" height="90" rx="8" fill="#e1d5e7" stroke="#9673a6" stroke-width="1.5"/>
  <text x="360" y="280" text-anchor="middle" font-size="12" fill="#5a3d6a">Training</text>
  <text x="360" y="300" text-anchor="middle" font-size="11" fill="#555">CycleCloud</text>

  <rect x="480" y="240" width="160" height="90" rx="8" fill="#e1d5e7" stroke="#9673a6" stroke-width="1.5"/>
  <text x="560" y="280" text-anchor="middle" font-size="12" fill="#5a3d6a">Agents</text>
  <text x="560" y="300" text-anchor="middle" font-size="11" fill="#555">Foundry</text>

  <text x="360" y="370" text-anchor="middle" font-size="12" fill="#333">A Landing Zone cria guardrails para que os times construam com consistência.</text>
</svg>