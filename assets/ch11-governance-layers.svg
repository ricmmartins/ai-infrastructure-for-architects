<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" font-family="Segoe UI, Arial, sans-serif" role="img">
  <title>Camadas de Governança para AI</title>
  <desc>Principais camadas de governança que o arquiteto deve considerar.</desc>

  <text x="320" y="35" text-anchor="middle" font-weight="bold" font-size="18" fill="#1a3a5c">Camadas de Governança</text>

  <rect x="40" y="60" width="560" height="40" rx="6" fill="#dae8fc" stroke="#6c8ebf"/>
  <text x="320" y="85" text-anchor="middle" font-size="13" fill="#1a3a5c">Políticas (Azure Policy)</text>

  <rect x="60" y="115" width="520" height="40" rx="6" fill="#d5e8d4" stroke="#82b366"/>
  <text x="320" y="140" text-anchor="middle" font-size="13" fill="#2d5a1b">Identidade e Acesso (RBAC + Managed Identity)</text>

  <rect x="80" y="170" width="480" height="40" rx="6" fill="#fff2cc" stroke="#d6b656"/>
  <text x="320" y="195" text-anchor="middle" font-size="13" fill="#7a5900">Rede e Isolamento (Private Endpoints)</text>

  <rect x="100" y="225" width="440" height="40" rx="6" fill="#e1d5e7" stroke="#9673a6"/>
  <text x="320" y="250" text-anchor="middle" font-size="13" fill="#5a3d6a">Observabilidade e Custo</text>
</svg>