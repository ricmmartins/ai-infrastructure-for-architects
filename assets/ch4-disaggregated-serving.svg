<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" font-family="Segoe UI, Arial, sans-serif" role="img">
  <title>Disaggregated Serving</title>
  <desc>Arquitetura de disaggregated serving separando pools de Prefill e Decode para otimizar latência e throughput.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#666"/>
    </marker>
  </defs>

  <text x="380" y="35" text-anchor="middle" font-weight="bold" font-size="18" fill="#1a3a5c">Disaggregated Serving</text>

  <!-- Request -->
  <rect x="40" y="70" width="140" height="50" rx="8" fill="#fff2cc" stroke="#d6b656" stroke-width="2"/>
  <text x="110" y="100" text-anchor="middle" font-weight="bold" font-size="12" fill="#7a5900">Request</text>

  <line x1="180" y1="95" x2="220" y2="95" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Prefill Pool -->
  <rect x="230" y="60" width="200" height="180" rx="10" fill="#dae8fc" stroke="#6c8ebf" stroke-width="2"/>
  <text x="330" y="90" text-anchor="middle" font-weight="bold" font-size="14" fill="#1a3a5c">Prefill Pool</text>
  <rect x="255" y="110" width="150" height="40" rx="6" fill="#f8f9fa" stroke="#888"/>
  <text x="330" y="135" text-anchor="middle" font-size="11" fill="#333">GPU Prefill 1</text>
  <rect x="255" y="160" width="150" height="40" rx="6" fill="#f8f9fa" stroke="#888"/>
  <text x="330" y="185" text-anchor="middle" font-size="11" fill="#333">GPU Prefill 2</text>

  <line x1="430" y1="150" x2="480" y2="150" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="455" y="140" text-anchor="middle" font-size="10" fill="#555">KV Cache</text>

  <!-- Decode Pool -->
  <rect x="490" y="60" width="230" height="180" rx="10" fill="#d5e8d4" stroke="#82b366" stroke-width="2"/>
  <text x="605" y="90" text-anchor="middle" font-weight="bold" font-size="14" fill="#2d5a1b">Decode Pool</text>
  <rect x="515" y="110" width="180" height="40" rx="6" fill="#f8f9fa" stroke="#888"/>
  <text x="605" y="135" text-anchor="middle" font-size="11" fill="#333">GPU Decode 1</text>
  <rect x="515" y="160" width="180" height="40" rx="6" fill="#f8f9fa" stroke="#888"/>
  <text x="605" y="185" text-anchor="middle" font-size="11" fill="#333">GPU Decode 2</text>

  <!-- Output -->
  <line x1="605" y1="240" x2="605" y2="270" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="535" y="280" width="140" height="50" rx="8" fill="#e1d5e7" stroke="#9673a6" stroke-width="2"/>
  <text x="605" y="310" text-anchor="middle" font-weight="bold" font-size="12" fill="#5a3d6a">Response</text>

  <text x="380" y="355" text-anchor="middle" font-size="12" fill="#555">Separa compute-bound (Prefill) de memory-bound (Decode) para melhor utilização</text>
</svg>