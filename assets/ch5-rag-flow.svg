<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" font-family="Segoe UI, Arial, sans-serif" role="img">
  <title>Fluxo básico de RAG</title>
  <desc>Fluxo principal de uma arquitetura RAG: query, retrieval, context augmentation e generation.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#666"/>
    </marker>
  </defs>

  <text x="380" y="35" text-anchor="middle" font-weight="bold" font-size="18" fill="#1a3a5c">Fluxo de RAG</text>

  <!-- Query -->
  <rect x="30" y="80" width="130" height="60" rx="8" fill="#fff2cc" stroke="#d6b656" stroke-width="2"/>
  <text x="95" y="115" text-anchor="middle" font-weight="bold" font-size="13" fill="#7a5900">Query</text>

  <line x1="160" y1="110" x2="200" y2="110" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Retrieval -->
  <rect x="210" y="70" width="160" height="80" rx="8" fill="#dae8fc" stroke="#6c8ebf" stroke-width="2"/>
  <text x="290" y="100" text-anchor="middle" font-weight="bold" font-size="13" fill="#1a3a5c">Retrieval</text>
  <text x="290" y="120" text-anchor="middle" font-size="11" fill="#555">Vector DB / Hybrid</text>

  <line x1="370" y1="110" x2="410" y2="110" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Context -->
  <rect x="420" y="70" width="150" height="80" rx="8" fill="#d5e8d4" stroke="#82b366" stroke-width="2"/>
  <text x="495" y="100" text-anchor="middle" font-weight="bold" font-size="13" fill="#2d5a1b">Contexto</text>
  <text x="495" y="120" text-anchor="middle" font-size="11" fill="#555">Augmentation</text>

  <line x1="570" y1="110" x2="610" y2="110" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Generation -->
  <rect x="620" y="80" width="110" height="60" rx="8" fill="#e1d5e7" stroke="#9673a6" stroke-width="2"/>
  <text x="675" y="115" text-anchor="middle" font-weight="bold" font-size="13" fill="#5a3d6a">LLM</text>

  <text x="380" y="200" text-anchor="middle" font-size="12" fill="#333">O retrieval adiciona latência no caminho crítico.</text>
  <text x="380" y="220" text-anchor="middle" font-size="12" fill="#333">A qualidade do retrieval define a qualidade da resposta.</text>
  <text x="380" y="260" text-anchor="middle" font-size="11" fill="#555" font-style="italic">Decisão do arquiteto: o quanto de latência você aceita para ter dados mais frescos e precisos?</text>
</svg>