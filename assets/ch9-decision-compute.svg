<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" font-family="Segoe UI, Arial, sans-serif" role="img">
  <title>Decisão de Compute Pattern</title>
  <desc>Framework simples para escolher o padrão de compute no Azure.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#666"/>
    </marker>
  </defs>

  <text x="340" y="35" text-anchor="middle" font-weight="bold" font-size="16" fill="#1a3a5c">Qual padrão de compute?</text>

  <rect x="190" y="55" width="300" height="45" rx="8" fill="#dae8fc" stroke="#6c8ebf" stroke-width="2"/>
  <text x="340" y="82" text-anchor="middle" font-weight="bold" font-size="12" fill="#1a3a5c">É principalmente training em larga escala?</text>

  <line x1="250" y1="100" x2="140" y2="140" stroke="#c62828" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="170" y="120" font-size="11" fill="#c62828" font-weight="bold">Sim</text>

  <line x1="430" y1="100" x2="540" y2="140" stroke="#2e7d32" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="490" y="120" font-size="11" fill="#2e7d32" font-weight="bold">Não</text>

  <rect x="40" y="150" width="200" height="70" rx="8" fill="#e1d5e7" stroke="#9673a6" stroke-width="2"/>
  <text x="140" y="180" text-anchor="middle" font-weight="bold" font-size="12" fill="#5a3d6a">CycleCloud / Slurm</text>
  <text x="140" y="200" text-anchor="middle" font-size="11" fill="#555">Jobs longos multi-node</text>

  <rect x="440" y="150" width="200" height="70" rx="8" fill="#d5e8d4" stroke="#82b366" stroke-width="2"/>
  <text x="540" y="180" text-anchor="middle" font-weight="bold" font-size="12" fill="#2d5a1b">AKS ou Foundry</text>
  <text x="540" y="200" text-anchor="middle" font-size="11" fill="#555">Inference e agents</text>
</svg>