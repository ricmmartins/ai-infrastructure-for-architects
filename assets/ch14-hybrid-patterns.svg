<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" font-family="Segoe UI, Arial, sans-serif" role="img">
  <title>Padrões Híbridos Comuns</title>
  <desc>Combinações frequentes de padrões que o arquiteto encontra em sistemas reais.</desc>

  <text x="380" y="35" text-anchor="middle" font-weight="bold" font-size="18" fill="#1a3a5c">Padrões Híbridos</text>

  <rect x="30" y="70" width="220" height="240" rx="10" fill="#dae8fc" stroke="#6c8ebf" stroke-width="2"/>
  <text x="140" y="105" text-anchor="middle" font-weight="bold" font-size="14" fill="#1a3a5c">Closed + Open</text>
  <text x="140" y="140" text-anchor="middle" font-size="11" fill="#333">Router de modelos</text>
  <text x="140" y="160" text-anchor="middle" font-size="11" fill="#333">Custo vs qualidade</text>
  <text x="140" y="180" text-anchor="middle" font-size="11" fill="#333">Data residency</text>
  <text x="140" y="220" text-anchor="middle" font-size="11" fill="#555">Mais comum em produção</text>

  <rect x="270" y="70" width="220" height="240" rx="10" fill="#d5e8d4" stroke="#82b366" stroke-width="2"/>
  <text x="380" y="105" text-anchor="middle" font-weight="bold" font-size="14" fill="#2d5a1b">RAG + Agent</text>
  <text x="380" y="140" text-anchor="middle" font-size="11" fill="#333">Retrieval dinâmico</text>
  <text x="380" y="160" text-anchor="middle" font-size="11" fill="#333">Múltiplos passos</text>
  <text x="380" y="180" text-anchor="middle" font-size="11" fill="#333">Tools de busca</text>
  <text x="380" y="220" text-anchor="middle" font-size="11" fill="#555">Alto valor, maior custo</text>

  <rect x="510" y="70" width="220" height="240" rx="10" fill="#e1d5e7" stroke="#9673a6" stroke-width="2"/>
  <text x="620" y="105" text-anchor="middle" font-weight="bold" font-size="14" fill="#5a3d6a">Managed + Self</text>
  <text x="620" y="140" text-anchor="middle" font-size="11" fill="#333">Foundry + AKS</text>
  <text x="620" y="160" text-anchor="middle" font-size="11" fill="#333">Controle seletivo</text>
  <text x="620" y="180" text-anchor="middle" font-size="11" fill="#333">Evolução gradual</text>
  <text x="620" y="220" text-anchor="middle" font-size="11" fill="#555">Boa estratégia de transição</text>
</svg>