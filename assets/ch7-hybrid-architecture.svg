<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" font-family="Segoe UI, Arial, sans-serif" role="img">
  <title>Arquitetura Híbrida: Closed + Open Weights</title>
  <desc>Padrão híbrido combinando modelos fechados (API) com open weights self-hosted.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#666"/>
    </marker>
  </defs>

  <text x="380" y="35" text-anchor="middle" font-weight="bold" font-size="18" fill="#1a3a5c">Arquitetura Híbrida</text>

  <!-- User -->
  <rect x="30" y="90" width="120" height="50" rx="8" fill="#fff2cc" stroke="#d6b656" stroke-width="2"/>
  <text x="90" y="120" text-anchor="middle" font-weight="bold" font-size="12" fill="#7a5900">Usuário</text>

  <line x1="150" y1="115" x2="190" y2="115" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Router -->
  <rect x="200" y="80" width="140" height="70" rx="8" fill="#dae8fc" stroke="#6c8ebf" stroke-width="2"/>
  <text x="270" y="110" text-anchor="middle" font-weight="bold" font-size="13" fill="#1a3a5c">Router</text>
  <text x="270" y="130" text-anchor="middle" font-size="11" fill="#555">Decisão de rota</text>

  <line x1="340" y1="100" x2="380" y2="80" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="340" y1="130" x2="380" y2="160" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Closed -->
  <rect x="390" y="50" width="160" height="70" rx="8" fill="#d5e8d4" stroke="#82b366" stroke-width="2"/>
  <text x="470" y="80" text-anchor="middle" font-weight="bold" font-size="13" fill="#2d5a1b">Modelo Fechado</text>
  <text x="470" y="100" text-anchor="middle" font-size="11" fill="#555">API / Foundry</text>

  <!-- Open -->
  <rect x="390" y="150" width="160" height="70" rx="8" fill="#e1d5e7" stroke="#9673a6" stroke-width="2"/>
  <text x="470" y="180" text-anchor="middle" font-weight="bold" font-size="13" fill="#5a3d6a">Open Weights</text>
  <text x="470" y="200" text-anchor="middle" font-size="11" fill="#555">Self-hosted</text>

  <text x="380" y="270" text-anchor="middle" font-size="12" fill="#333">O router decide com base em: custo, latência, dados sensíveis, complexidade da tarefa.</text>
  <text x="380" y="295" text-anchor="middle" font-size="12" fill="#333">Permite otimizar custo sem abrir mão de qualidade quando necessário.</text>
  <text x="380" y="340" text-anchor="middle" font-size="11" fill="#555" font-style="italic">Padrão cada vez mais comum em empresas maduras.</text>
</svg>