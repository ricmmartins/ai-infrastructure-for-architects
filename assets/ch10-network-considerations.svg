<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 280" font-family="Segoe UI, Arial, sans-serif" role="img">
  <title>Considerações de Rede para AI</title>
  <desc>Principais preocupações de networking dependendo do modo de AI.</desc>

  <text x="340" y="35" text-anchor="middle" font-weight="bold" font-size="18" fill="#1a3a5c">Rede por Modo</text>

  <rect x="40" y="70" width="180" height="150" rx="8" fill="#dae8fc" stroke="#6c8ebf" stroke-width="2"/>
  <text x="130" y="105" text-anchor="middle" font-weight="bold" font-size="13" fill="#1a3a5c">Training</text>
  <text x="130" y="135" text-anchor="middle" font-size="11" fill="#333">InfiniBand</text>
  <text x="130" y="155" text-anchor="middle" font-size="11" fill="#333">All-reduce</text>
  <text x="130" y="175" text-anchor="middle" font-size="11" fill="#333">Baixa latência</text>

  <rect x="250" y="70" width="180" height="150" rx="8" fill="#d5e8d4" stroke="#82b366" stroke-width="2"/>
  <text x="340" y="105" text-anchor="middle" font-weight="bold" font-size="13" fill="#2d5a1b">Inference</text>
  <text x="340" y="135" text-anchor="middle" font-size="11" fill="#333">Baixa latência</text>
  <text x="340" y="155" text-anchor="middle" font-size="11" fill="#333">Alto throughput</text>
  <text x="340" y="175" text-anchor="middle" font-size="11" fill="#333">Private endpoints</text>

  <rect x="460" y="70" width="180" height="150" rx="8" fill="#e1d5e7" stroke="#9673a6" stroke-width="2"/>
  <text x="550" y="105" text-anchor="middle" font-weight="bold" font-size="13" fill="#5a3d6a">Agents / RAG</text>
  <text x="550" y="135" text-anchor="middle" font-size="11" fill="#333">Chamadas a APIs</text>
  <text x="550" y="155" text-anchor="middle" font-size="11" fill="#333">Vector DB</text>
  <text x="550" y="175" text-anchor="middle" font-size="11" fill="#333">Governança</text>
</svg>